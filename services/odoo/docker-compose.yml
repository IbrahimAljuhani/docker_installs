# Odoo stack — official Docker Hub images. See deploy.sh's own changelog
# comment for the deliberate deviations from a bare `docker run` setup
# (UID/GID detection, healthcheck, POSTGRES_DB left as the maintenance DB,
# etc).
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it
# (and the generated .env) into ~/docker/odoo/<instance>/ once per instance
# and runs it from there — Compose substitutes ${VARS} from the .env file
# sitting alongside it in that same runtime folder.
#
# Odoo is multi-instance (unlike this repo's other services): each instance
# gets its own directory, so 'odoo-net' and 'odoo-data' below don't need an
# instance suffix in their YAML keys — Compose already prefixes network/
# volume names with the per-directory project name, which is what keeps
# multiple instances from colliding on the same host.
#
# No host ports are hardcoded here on purpose — see deploy.sh's
# prompt_odoo_ports: publishing them is optional (default: reach the
# container by name over 'main-net' only) and, when enabled, applied via a
# generated docker-compose.override.yml instead.

services:
  odoo:
    image: ${ODOO_IMAGE}
    container_name: odoo-${INSTANCE_NAME}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
      - odoo-data:/var/lib/odoo
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - odoo-net
      - main-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8069/web/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: postgres:17
    container_name: odoo-${INSTANCE_NAME}-db
    env_file:
      - .env
    volumes:
      - ./db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - odoo-net

volumes:
  odoo-data:

networks:
  odoo-net:
    driver: bridge
  main-net:
    external: true
