# n8n stack — adapted from the official n8n-io/n8n-hosting reference at
# docker-compose/withPostgres/docker-compose.yml:
# https://github.com/n8n-io/n8n-hosting/tree/main/docker-compose/withPostgres
# (external task-runner architecture — n8n itself no longer executes
# workflow code in-process, it delegates to the separate 'runner' container).
#
# Deliberate deviations from upstream:
#   - No host port published for 'app' — NGINX Proxy Manager reaches it by
#     container name over the shared 'main-net' instead (see README.md).
#   - Added the reverse-proxy env vars (N8N_HOST, N8N_PROTOCOL, N8N_PORT,
#     N8N_PROXY_HOPS, N8N_WEBHOOK_URL) the official n8n docs document as
#     required behind a reverse proxy — upstream's own example assumes
#     direct/local access instead.
#   - 'db' and 'runner' stay on the private 'n8n-net' only; only 'app' joins
#     'main-net'.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it (and
# the generated .env, and init-data.sh) to ~/docker/n8n/ and runs it from there.

networks:
  n8n-net:
  main-net:
    external: true

volumes:
  db-data:
  n8n-data:

services:
  db:
    image: postgres:16
    container_name: n8n-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - n8n-net

  app:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-stable}
    container_name: n8n-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: "${POSTGRES_DB}"
      DB_POSTGRESDB_USER: "${POSTGRES_NON_ROOT_USER}"
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_NON_ROOT_PASSWORD}"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: "${RUNNERS_AUTH_TOKEN}"
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      # Reverse-proxy awareness: without these, n8n registers/display webhook
      # URLs pointing at itself over plain http instead of your real domain.
      # N8N_PROTOCOL/N8N_WEBHOOK_URL/N8N_SECURE_COOKIE come from .env (not
      # hardcoded) — 'https' assumes NPM/TLS in front and n8n rejects login
      # entirely over a bare-http:// direct host port when N8N_SECURE_COOKIE
      # is true (browsers won't send a secure cookie over plain HTTP). See
      # deploy.sh's HOST_PORT handling and README "Reverse Proxy" section.
      N8N_HOST: "${N8N_HOST}"
      N8N_PROTOCOL: "${N8N_PROTOCOL:-https}"
      N8N_PORT: 5678
      N8N_PROXY_HOPS: 1
      N8N_WEBHOOK_URL: "${N8N_WEBHOOK_URL}"
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-true}"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
    networks:
      - n8n-net
      - main-net

  runner:
    image: n8nio/runners:${N8N_VERSION:-stable}
    container_name: n8n-runner
    restart: unless-stopped
    environment:
      N8N_RUNNERS_AUTH_TOKEN: "${RUNNERS_AUTH_TOKEN}"
      N8N_RUNNERS_TASK_BROKER_URI: "http://app:5679"
    depends_on:
      - app
    networks:
      - n8n-net
