# Immich — official release-attached docker-compose.yml, verified against
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
# (the actual self-host distribution artifact, not the repo's root compose
# file — that one builds from source and is for local development).
#
# 4 containers: immich-server (app/API), immich-machine-learning (face
# recognition / smart search — CPU-only by default, see README.md's Known
# Simplifications for hardware acceleration), redis, and a Postgres image
# with the pgvector/vectorchord extension built in (must be this specific
# image — plain postgres won't work, Immich's smart search relies on it).
#
# Deliberate deviations from upstream's own docker-compose example:
#   - No host port published by default — NGINX Proxy Manager reaches
#     immich-server by container name over the shared 'main-net' instead
#     (see README.md). Upstream's own example publishes 2283:2283
#     unconditionally.
#   - redis/database/immich-machine-learning stay on the private
#     'immich-net' only; only 'immich-server' also joins 'main-net'.
#   - Added 'condition: service_healthy' on immich-server's depends_on for
#     redis/database (both images already ship a working healthcheck
#     upstream enables explicitly) instead of a bare depends_on, so the
#     server doesn't race a not-yet-ready database on first boot.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it (and
# the generated .env) to ~/docker/immich/ and runs it from there.

name: immich

services:
  immich-server:
    container_name: immich-app
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ./library:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    healthcheck:
      disable: false
    networks:
      - immich-net
      - main-net

  immich-machine-learning:
    container_name: immich-ml
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - immich-net

  redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - immich-net

  database:
    container_name: immich-db
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_DB: "${DB_DATABASE_NAME}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ./postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - immich-net

volumes:
  model-cache:

networks:
  immich-net:
  main-net:
    external: true
