# Redmine stack — official Docker Hub image + Postgres:
# https://hub.docker.com/_/redmine
#
# Deliberate deviations from upstream's own docker-compose example:
#   - Postgres instead of upstream's MySQL example (matches every other
#     service in this repo).
#   - No host port published for 'redmine' — NGINX Proxy Manager reaches it
#     by container name over the shared 'main-net' instead (see README.md).
#   - 'db' stays on the private 'redmine-net' only; only 'redmine' joins
#     'main-net'.
#   - 'plugins' and 'themes' are bind mounts (you install a plugin/theme by
#     dropping its files in and restarting) — matches this repo's odoo
#     addons/config convention. 'files' (uploaded attachments) stays a named
#     volume since nothing needs direct host access to it.
#
# Unlike this repo's other services (OpenProject/Nextcloud/n8n/Taiga),
# Redmine has NO Host-header validation and does NOT force HTTPS by default
# — verified directly against redmine/redmine's own
# config/environments/production.rb (no config.hosts set; config.force_ssl
# is commented out). So there's no "flip these vars when using a direct host
# port" dance needed here, unlike those four. The domain/URL Redmine uses in
# emails etc. is instead configured from its own Administration UI after
# first login (Administration → Settings → General → "Host name and path"),
# not at deploy time.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it (and
# the generated .env) to ~/docker/redmine/ and runs it from there.

services:
  redmine:
    image: redmine:${REDMINE_VERSION:-6-alpine}
    container_name: redmine-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_USERNAME: "${POSTGRES_USER}"
      REDMINE_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      REDMINE_DB_DATABASE: "${POSTGRES_DB}"
      REDMINE_SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
    volumes:
      - redmine-files:/usr/src/redmine/files
      - ./plugins:/usr/src/redmine/plugins
      - ./themes:/usr/src/redmine/public/themes
    depends_on:
      db:
        condition: service_healthy
    networks:
      - redmine-net
      - main-net

  db:
    image: postgres:17
    container_name: redmine-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - redmine-net

volumes:
  db-data:
  redmine-files:

networks:
  redmine-net:
  main-net:
    external: true
