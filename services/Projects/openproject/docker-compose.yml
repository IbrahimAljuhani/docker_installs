# OpenProject stack — adapted from the official opf/openproject-docker-compose
# (stable/17 branch): https://github.com/opf/openproject-docker-compose
#
# Deliberate deviations from upstream:
#   - Upstream's own 'proxy' (Caddy) and 'autoheal' services are dropped.
#     This framework uses NGINX Proxy Manager as the single reverse proxy for
#     every service (see ../../install_dockhub.sh), so a second
#     per-service proxy is redundant. 'autoheal' needs a docker.sock mount
#     that isn't worth the extra attack surface for a first deployment.
#   - Only 'web' (the app) and 'hocuspocus' (real-time/collaborative editing)
#     join the shared 'main-net' so NPM can reach them by container name.
#     'db', 'cache', 'worker', 'cron', 'seeder' stay on the private
#     'openproject-net' only.
#   - Upstream's inline proxy forwarded /hocuspocus* to hocuspocus:1234 and
#     everything else to web:8080 — replicate this in NPM (see README.md,
#     "Reverse Proxy" section) instead of running the Caddy container.
#   - Postgres bumped to 17 (upstream still defaults to 13, which is stale —
#     OpenProject has required 16+ since 16.0.0, and some migrations need
#     15+'s `NULLS NOT DISTINCT` index syntax; on 13 the seeder hangs/retries
#     that migration forever and web never boots).
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it (and
# the generated .env) to ~/docker/openproject/ and runs it from there.

networks:
  openproject-net:
  main-net:
    external: true

volumes:
  pgdata:
  opdata:

x-op-restart-policy: &restart_policy
  restart: unless-stopped
x-op-image: &image
  image: openproject/openproject:${TAG:-17-slim}
x-op-app: &app
  <<: [*image, *restart_policy]
  env_file:
    - .env
  environment:
    OPENPROJECT_RAILS__CACHE__STORE: "memcache"
    OPENPROJECT_CACHE__MEMCACHE__SERVER: "cache:11211"
    OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__URL: "wss://${OPENPROJECT_HOST__NAME}/hocuspocus"
    DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@db/openproject?pool=20&encoding=unicode&reconnect=true"
  volumes:
    - opdata:/var/openproject/assets
  networks:
    - openproject-net

services:
  db:
    # OpenProject officially requires Postgres 16+ (since OpenProject 16.0.0);
    # current Docker installs default to 17. Some migrations use syntax
    # (e.g. `CREATE UNIQUE INDEX ... NULLS NOT DISTINCT`) that needs 15+ and
    # will hang/fail-loop on older versions. Upstream's own reference compose
    # still defaults to 13, which is stale — don't copy that default again.
    image: postgres:${POSTGRES_VERSION:-17}
    container_name: openproject-db
    restart: unless-stopped
    stop_grace_period: "3s"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openproject
    networks:
      - openproject-net

  cache:
    image: memcached
    container_name: openproject-cache
    restart: unless-stopped
    networks:
      - openproject-net

  web:
    <<: *app
    container_name: openproject-app
    command: "./docker/prod/web"
    hostname: "${OPENPROJECT_HOST__NAME}"
    networks:
      - openproject-net
      - main-net
    depends_on:
      - db
      - cache
      - seeder
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health_checks/default"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    container_name: openproject-worker
    command: "./docker/prod/worker"
    depends_on:
      - db
      - cache
      - seeder

  cron:
    <<: *app
    container_name: openproject-cron
    command: "./docker/prod/cron"
    depends_on:
      - db
      - cache
      - seeder

  seeder:
    <<: *app
    container_name: openproject-seeder
    command: "./docker/prod/seeder"
    restart: on-failure

  hocuspocus:
    image: openproject/hocuspocus:17.6.0
    container_name: openproject-hocuspocus
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SECRET: "${COLLABORATIVE_SERVER_SECRET}"
      OPENPROJECT_URL: "http://web:8080"
      OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-true}"
    networks:
      - openproject-net
      - main-net
