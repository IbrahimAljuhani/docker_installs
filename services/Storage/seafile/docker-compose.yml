# Seafile Community Edition, verified against Seafile's own Docker templates
# for 13.0: https://manual.seafile.com/13.0/setup/setup_ce_by_docker/
# (.env → https://manual.seafile.com/13.0/repo/docker/ce/env,
#  compose → https://manual.seafile.com/13.0/repo/docker/ce/seafile-server.yml)
#
# Three containers: seafile-app (Seahub + seaf-server), seafile-db (MariaDB)
# and seafile-redis (cache).
#
# ⚠️ MOST GUIDES YOU'LL FIND ARE FOR SEAFILE 11 OR EARLIER AND ARE WRONG NOW.
# Seafile 12 and 13 changed the deployment substantially: configuration moved
# out of compose `environment:` blocks into a .env file, memcached was
# replaced by Redis as the default cache (13), and the stack is now split
# across several compose files selected by a COMPOSE_FILE variable. Anything
# telling you to edit ccnet.conf by hand, or setting SEAFILE_ADMIN_EMAIL
# (rather than INIT_SEAFILE_ADMIN_EMAIL), predates this.
#
# Deliberate deviations from Seafile's own templates:
#
#   - NO CADDY. Upstream's default COMPOSE_FILE is
#     'seafile-server.yml,caddy.yml,seadoc.yml', and its caddy.yml claims host
#     ports 80 and 443 — a direct collision with NGINX Proxy Manager. What
#     Caddy actually does there is minimal: its labels on the seafile service
#     are just `caddy.reverse_proxy: "{{upstreams 80}}"`, i.e. proxy
#     everything to port 80. NPM does exactly that, so dropping Caddy costs
#     nothing. Upstream's compose has the seafile `ports:` block commented
#     out for the same reason — deploy.sh publishes one only if you ask.
#
#   - SEADOC DISABLED (ENABLE_SEADOC=false; upstream defaults it to true).
#     SeaDoc is the collaborative document editor and it is a whole separate
#     container plus a `/sdoc-server` path that the reverse proxy has to
#     route. Left at upstream's default WITHOUT deploying that container,
#     Seafile advertises an editor endpoint that doesn't exist and document
#     editing fails at the point of use rather than at deploy time. Off is
#     the honest default here; the README explains how to turn it on.
#
#   - Named volumes instead of upstream's bind mounts under /opt. Their
#     templates hardcode /opt/seafile-data, /opt/seafile-mysql/db and so on,
#     which sit outside the user's home and don't fit this repo's
#     "everything under ~/docker/<service>" convention.
#
#   - SEAFILE_LOG_TO_STDOUT=true (upstream: false). By default Seafile writes
#     its logs to files inside the data volume, where `docker compose logs`
#     shows nothing useful and diagnosing a failed start means exec'ing in to
#     go looking. Sending them to stdout makes the normal Docker workflow
#     work.
#
#   - A generated Redis password. Upstream ships REDIS_PASSWORD empty, which
#     starts Redis with `--requirepass ""` — no authentication.
#
#   - Redis pinned to a major version; upstream uses the bare `redis` tag,
#     which is whatever `latest` happens to be on the day you pull.
#
#   - MariaDB left at upstream's 10.11 pin ON PURPOSE, even though this repo
#     uses 11.8 elsewhere. Seafile is specific about its database and 10.11
#     is what upstream tests against; this is not the place to be clever.
#
# This is a single-instance service: one Seafile deployment per host, under
# ~/docker/seafile/.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it
# (and the generated .env) to ~/docker/seafile/ and runs it from there.

services:
  seafile-db:
    image: mariadb:10.11
    container_name: seafile-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
      MYSQL_LOG_CONSOLE: "true"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - seafile-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--mariadbupgrade", "--innodb_initialized"]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10
    networks:
      - seafile-net

  seafile-redis:
    image: redis:7-alpine
    container_name: seafile-redis
    restart: unless-stopped
    # Upstream's own command line, kept verbatim: persistence off (this is a
    # pure cache — losing it costs a warm-up, not data) and a password read
    # from the environment. The $$ escapes so Compose passes a literal $ and
    # the shell inside the container expands it.
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - seafile-net

  seafile-app:
    image: seafileltd/seafile-mc:${SEAFILE_VERSION:-13.0-latest}
    container_name: seafile-app
    restart: unless-stopped
    volumes:
      - seafile-data:/shared
    environment:
      SEAFILE_MYSQL_DB_HOST: seafile-db
      SEAFILE_MYSQL_DB_PORT: "3306"
      SEAFILE_MYSQL_DB_USER: ${SEAFILE_MYSQL_DB_USER:-seafile}
      SEAFILE_MYSQL_DB_PASSWORD: ${SEAFILE_MYSQL_DB_PASSWORD}
      INIT_SEAFILE_MYSQL_ROOT_PASSWORD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      TIME_ZONE: ${TIME_ZONE:-Etc/UTC}
      # INIT_ prefix means first-startup only. Changing these later does
      # nothing — the admin password is changed from inside Seafile.
      INIT_SEAFILE_ADMIN_EMAIL: ${INIT_SEAFILE_ADMIN_EMAIL}
      INIT_SEAFILE_ADMIN_PASSWORD: ${INIT_SEAFILE_ADMIN_PASSWORD}
      # Hostname WITHOUT a scheme, protocol separately. Both are baked into
      # the links Seafile generates and into its CSRF trusted origins, so
      # they must match how the browser actually reaches it.
      SEAFILE_SERVER_HOSTNAME: ${SEAFILE_SERVER_HOSTNAME}
      SEAFILE_SERVER_PROTOCOL: ${SEAFILE_SERVER_PROTOCOL:-https}
      SITE_ROOT: /
      NON_ROOT: "false"
      # Signs internal service-to-service tokens. Must stay stable forever.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      SEAFILE_LOG_TO_STDOUT: "true"
      ENABLE_GO_FILESERVER: "true"
      # See the header note — off because the sdoc-server container isn't
      # deployed here.
      ENABLE_SEADOC: "false"
      CACHE_PROVIDER: redis
      REDIS_HOST: seafile-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENABLE_NOTIFICATION_SERVER: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      seafile-db:
        condition: service_healthy
      seafile-redis:
        condition: service_started
    networks:
      - seafile-net
      - main-net

volumes:
  seafile-data:
  seafile-db-data:

networks:
  seafile-net:
    driver: bridge
  main-net:
    external: true
