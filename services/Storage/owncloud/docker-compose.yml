# ownCloud Infinite Scale (oCIS) via the official owncloud/ocis image,
# verified against upstream's own deployment example:
# https://github.com/owncloud/ocis/blob/master/deployments/examples/ocis_full/ocis.yml
#
# ONE container. No database, no Redis, no PHP — oCIS is a single Go binary
# with everything embedded, including its own identity provider (IDM) and
# metadata store. That makes it the lightest storage service in this repo by
# a wide margin, and a genuinely different option from Nextcloud rather than
# a near-duplicate.
#
# WHY INFINITE SCALE AND NOT ownCloud SERVER (CLASSIC)
# ownCloud ships two products. Classic (PHP, now at version 11) is in
# maintenance: upstream states no major new features are being built on that
# codebase and that it is kept "secure, supported and compliant while people
# plan their migration". Infinite Scale is the direction of the product. It
# is also architecturally distinct from this repo's Nextcloud (PHP + MariaDB
# + Redis), where Classic would have been nearly identical to it.
#
# The trade: no PHP app store, and a different sharing/user model. If you
# specifically need the Classic app ecosystem, this is not that.
#
# ⚠️ oCIS FETCHES ITS OWN PUBLIC URL. Its embedded identity provider verifies
# every access token by requesting
# https://<your-domain>/.well-known/openid-configuration — from INSIDE the
# container. So the container itself has to be able to resolve and reach your
# public domain, not just your browser. On a home/LAN server whose router
# doesn't hairpin, that request fails and login dies with "failed to verify
# access token ... connection refused", even though the site loads fine.
# Reported repeatedly upstream: owncloud/ocis issues #6357, #6612, #7438 and
# #10446 are all this.
#
# Upstream's own example solves it by giving the Traefik container a Docker
# network alias equal to the public domain, so oCIS's DNS lookup lands on the
# proxy container. That is not available to us: NGINX Proxy Manager is core
# infrastructure created by install_dockhub.sh, not a service this compose
# file manages, so it cannot be given an alias from here. Instead deploy.sh
# writes an `extra_hosts` entry pointing the domain at `host-gateway` — the
# Docker host, where NPM publishes 443. Same effect, achieved from our side.
#
# Deliberate deviations from upstream's example:
#   - No Traefik. It would collide with NGINX Proxy Manager on 80/443.
#   - Only the variables a single-container deployment actually needs.
#     Upstream's example also sets GATEWAY_GRPC_ADDR, MICRO_REGISTRY_ADDRESS,
#     NATS_* and PROXY_CSP_CONFIG_FILE_LOCATION — those exist to let separate
#     Collabora/OnlyOffice/Tika containers reach oCIS's internals, and none of
#     those are deployed here.
#   - IDM_CREATE_DEMO_USERS stays false (upstream's default too) — the demo
#     users have published passwords.
#   - Admin password generated by deploy.sh; upstream's example falls back to
#     literal "admin".
#
# This is a single-instance service: one oCIS deployment per host, under
# ~/docker/owncloud/.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it
# (and the generated .env) to ~/docker/owncloud/ and runs it from there.

services:
  ocis:
    image: owncloud/ocis:${OCIS_VERSION:-8.1}
    container_name: owncloud-ocis
    restart: unless-stopped
    entrypoint:
      - /bin/sh
    # `ocis init` generates the config file and its random secrets. It fails
    # on every run after the first because the file already exists, which is
    # why the error is swallowed — this is upstream's own idiom, not a
    # shortcut. `exec` replaces the shell so oCIS receives signals directly
    # and `docker compose stop` doesn't have to fall back to SIGKILL.
    command: ["-c", "ocis init || true; exec ocis server"]
    environment:
      # The public URL. oCIS bakes this into OIDC issuer discovery, so it has
      # to match how the browser reaches it, exactly.
      OCIS_URL: ${OCIS_URL}
      OCIS_LOG_LEVEL: ${OCIS_LOG_LEVEL:-info}
      # false when NGINX Proxy Manager terminates TLS in front of us; true
      # when reached directly on a host port, where oCIS serves its own
      # self-signed certificate. deploy.sh sets this to match your choice —
      # getting it backwards is a 502 in one direction and a protocol error
      # in the other.
      PROXY_TLS: ${PROXY_TLS:-false}
      # Lets oCIS accept its own self-signed certificate when it calls its
      # public URL back for token verification. Only turned on for the
      # direct host-port path.
      OCIS_INSECURE: ${OCIS_INSECURE:-false}
      IDM_ADMIN_PASSWORD: ${OCIS_ADMIN_PASSWORD}
      # Upstream ships demo accounts with published passwords behind this.
      IDM_CREATE_DEMO_USERS: "false"
    volumes:
      # Config and data are separate volumes upstream, and worth keeping
      # separate here: /etc/ocis holds the generated secrets (including the
      # JWT secret and the machine auth key), /var/lib/ocis holds every file
      # users upload. Losing the first makes the second unreadable.
      - ocis-config:/etc/ocis
      - ocis-data:/var/lib/ocis
    networks:
      - main-net

volumes:
  ocis-config:
  ocis-data:

networks:
  main-net:
    external: true
