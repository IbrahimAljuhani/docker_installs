# ERPNext via the official frappe/erpnext image, adapted from Frappe's own
# frappe_docker repo (https://github.com/frappe/frappe_docker) — specifically
# its compose.yaml plus the single-file pwd.yml, which is the closest thing
# upstream ships to a self-contained production stack.
#
# This is the largest stack in this repo: 11 containers. They are not
# optional extras — Frappe genuinely splits the work this way:
#   configurator  one-shot; writes common_site_config.json (db + redis hosts)
#   create-site   one-shot; runs `bench new-site` and installs the erpnext app
#   backend       the Python app server (gunicorn)
#   frontend      nginx; serves static assets and routes to backend/websocket
#   websocket     Node.js socket.io — real-time updates in the UI
#   queue-short   background worker (short + default queues)
#   queue-long    background worker (long + default + short queues)
#   scheduler     cron-like scheduled jobs
#   db            MariaDB
#   redis-cache   cache
#   redis-queue   job queue + socketio pub/sub
#
# ⚠️ RESOURCES: ERPNext is heavy. 4 GB RAM is a realistic floor and 8 GB is
# comfortable. First-time site creation compiles assets and can take 5-15
# minutes — deploy.sh waits for it and tells you what's happening.
#
# ⚠️ SITE NAME = HOST HEADER. This is the single thing that trips people up.
# Frappe is multi-tenant: it picks which site to serve from the HTTP Host
# header, so a site must be NAMED after the domain it's reached at. Upstream's
# pwd.yml sidesteps this by naming the site "frontend" and only ever reaching
# it by container name. Here the site is named after your real domain, and
# FRAPPE_SITE_NAME_HEADER is pinned to that same name rather than left at
# upstream's `$$host` default — which means the site also answers on a direct
# IP:port, instead of returning "Site not found" the moment the Host header
# isn't the domain. Single-site by design; that pin is what rules out
# multi-site, and it's a deliberate trade for one less way to fail.
#
# Deliberate deviations from upstream's own files:
#   - Passwords are generated by deploy.sh. pwd.yml hardcodes `admin` for
#     both the MariaDB root password and the Administrator password.
#   - Only `frontend` joins 'main-net'; everything else stays on the private
#     'erpnext-net'. Upstream puts everything on one network with no external
#     network at all.
#   - No host port by default — NPM reaches `erpnext-frontend` by name.
#     Upstream's pwd.yml publishes 8080 unconditionally.
#   - UPSTREAM_REAL_IP_ADDRESS is set by deploy.sh to main-net's real subnet,
#     not left at 127.0.0.1. Without it every audit-log entry and login
#     record in the ERP shows NPM's container IP instead of the actual user's
#     — same class of setting as Jellyfin's "Known proxies" and NetBird's
#     trustedHTTPProxies.
#   - Explicit container_name on every service, matching this repo's
#     convention so NPM can address the frontend by a stable name.
#   - `restart: "no"` on the two one-shot containers rather than upstream's
#     `deploy.restart_policy.condition: none` — Compose v2 ignores most
#     `deploy` keys outside Swarm, so the upstream form doesn't reliably do
#     anything for `docker compose up`.
#
# This is a single-instance service: one ERPNext deployment per host, under
# ~/docker/erpnext/.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it
# (and the generated .env) to ~/docker/erpnext/ and runs it from there.

x-customizable-image: &customizable_image
  image: frappe/erpnext:${ERPNEXT_VERSION:-v16.31.1}
  # `missing`, not upstream's `always`. Upstream defaults to a floating tag
  # where re-pulling every start makes sense; this file pins an exact
  # version, so `always` would just mean 9 registry round-trips on every
  # rerun of deploy.sh for an image that cannot have changed. Update by
  # bumping ERPNEXT_VERSION in .env, or `docker compose pull`.
  pull_policy: missing
  restart: unless-stopped

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-backend-defaults: &backend_defaults
  <<: [*depends_on_configurator, *customizable_image]
  platform: linux/amd64
  volumes:
    - sites:/home/frappe/frappe-bench/sites
  networks:
    - erpnext-net

services:
  configurator:
    <<: *backend_defaults
    container_name: erpnext-configurator
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  create-site:
    <<: *customizable_image
    container_name: erpnext-create-site
    platform: linux/amd64
    restart: "no"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - erpnext-net
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      SITE_NAME: ${SITE_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
    entrypoint:
      - bash
      - -c
    # Upstream's pwd.yml opens this step with a ~15-line polling loop that
    # re-reads sites/common_site_config.json with jq until the db/redis keys
    # appear. That loop is redundant here: `depends_on: configurator:
    # service_completed_successfully` above already guarantees the
    # configurator process exited 0, and writing that file is the only thing
    # it does. Upstream's version also spans multiple lines with backslash
    # continuations inside a YAML folded scalar, where the newline folds to a
    # space and the trailing backslash then escapes it — subtle enough that
    # it isn't worth transcribing a construct that can't be verified here.
    # Every line below ends in `;` so folding to a single line is safe.
    #
    # The `-d sites/$$SITE_NAME` guard IS upstream's, and it's what makes
    # rerunning deploy.sh safe: on a second run this container starts, sees
    # the site already there, and exits 0 without touching anything.
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        if [ -d "sites/$$SITE_NAME" ]; then echo "Site $$SITE_NAME already exists - nothing to do"; exit 0; fi;
        echo "Creating site $$SITE_NAME - this takes several minutes";
        bench new-site --mariadb-user-host-login-scope='%' --admin-password="$$ADMIN_PASSWORD" --db-root-username=root --db-root-password="$$DB_PASSWORD" --install-app erpnext --set-default "$$SITE_NAME";

  backend:
    <<: *backend_defaults
    container_name: erpnext-backend
    environment:
      GUNICORN_THREADS: "4"
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "120"

  frontend:
    <<: *customizable_image
    container_name: erpnext-frontend
    platform: linux/amd64
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      # Pinned to the site name rather than upstream's `$$host` default —
      # see the header comment. This is what lets a direct IP:port work.
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend
      - websocket
    networks:
      - erpnext-net
      - main-net

  websocket:
    <<: [*depends_on_configurator, *customizable_image]
    container_name: erpnext-websocket
    platform: linux/amd64
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - erpnext-net

  queue-short:
    <<: *backend_defaults
    container_name: erpnext-queue-short
    command: bench worker --queue short,default

  queue-long:
    <<: *backend_defaults
    container_name: erpnext-queue-long
    command: bench worker --queue long,default,short

  scheduler:
    <<: *backend_defaults
    container_name: erpnext-scheduler
    command: bench schedule

  db:
    image: mariadb:11.8
    container_name: erpnext-db
    restart: unless-stopped
    # utf8mb4 throughout is required by Frappe, not a preference — it stores
    # emoji and non-Latin text (Arabic included) in ordinary fields.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - erpnext-net

  redis-cache:
    image: redis:6.2-alpine
    container_name: erpnext-redis-cache
    restart: unless-stopped
    networks:
      - erpnext-net

  redis-queue:
    image: redis:6.2-alpine
    container_name: erpnext-redis-queue
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data
    networks:
      - erpnext-net

volumes:
  sites:
  db-data:
  redis-queue-data:

networks:
  erpnext-net:
    driver: bridge
  main-net:
    external: true
