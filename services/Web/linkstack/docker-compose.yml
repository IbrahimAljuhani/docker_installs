# LinkStack — single official image, SQLite embedded (no separate db
# container): https://github.com/LinkStackOrg/linkstack-docker
#
# Deliberate deviations from upstream's own docker-compose example:
#   - No host port published by default — NGINX Proxy Manager reaches it by
#     container name over the shared 'main-net' instead (see README.md).
#     Upstream's own example publishes a host port (e.g. 8190:443)
#     unconditionally.
#   - No private '<service>-net' — unlike most of this repo's other
#     services, LinkStack genuinely has nothing else to isolate it from
#     (one container, SQLite embedded in its own volume, no db to keep off
#     main-net), so the app container joins 'main-net' directly.
#
# Unlike every other service here, LinkStack's container serves HTTPS
# internally on 443 with a self-signed cert, and upstream's own reverse-proxy
# guidance is to connect to THAT port over HTTPS (not proxy plain HTTP to
# port 80) to avoid mixed-content errors — see README.md's Reverse Proxy
# section for the exact NPM forward-scheme setting this requires.
#
# LinkStack is multi-instance (like this repo's Odoo): each instance gets
# its own directory, so 'linkstack_data' below doesn't need an instance
# suffix in its YAML key — Compose already prefixes volume names with the
# per-directory project name, which is what keeps multiple instances from
# colliding on the same host. container_name is explicitly suffixed with
# ${INSTANCE_NAME} instead, since Compose does NOT auto-suffix
# container_name the way it does for un-named volumes/networks.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it
# (and the generated .env) into ~/docker/linkstack/<instance>/ once per
# instance and runs it from there.

services:
  linkstack:
    image: linkstackorg/linkstack:${LINKSTACK_VERSION:-latest}
    container_name: linkstack-${INSTANCE_NAME}
    hostname: linkstack-${INSTANCE_NAME}
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      SERVER_ADMIN: "${SERVER_ADMIN:-admin@localhost}"
      HTTP_SERVER_NAME: "${SERVER_NAME}"
      HTTPS_SERVER_NAME: "${SERVER_NAME}"
      LOG_LEVEL: info
      PHP_MEMORY_LIMIT: 256M
      UPLOAD_MAX_FILESIZE: 8M
    volumes:
      - linkstack_data:/htdocs
    networks:
      - main-net

volumes:
  linkstack_data:

networks:
  main-net:
    external: true
