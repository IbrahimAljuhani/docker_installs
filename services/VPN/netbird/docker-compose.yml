# NetBird — official images, reproduced from the compose that upstream's own
# getting-started.sh generates when you pick reverse-proxy option
# [3] "Nginx Proxy Manager":
#   https://github.com/netbirdio/netbird/blob/main/infrastructure_files/getting-started.sh
#
# Upstream ships no static compose file — that script generates one after
# ~8 interactive prompts. This file is the "NPM + external network" variant
# of what it produces, written out statically so it fits this repo's
# curl-and-run model. Two containers, same images and layout upstream uses:
#   dashboard      (netbirdio/dashboard)     — the web UI
#   netbird-server (netbirdio/netbird-server) — management + signal + relay
#                                               + STUN, combined since v0.65
#
# Deliberate deviations from the script's own output:
#   - No bundled Traefik. The script's default option runs Traefik on host
#     ports 80/443 with its own Let's Encrypt — which would collide head-on
#     with NGINX Proxy Manager, already bound to both on a DockHub host.
#     Upstream supports exactly this: option [3] drops Traefik and routes to
#     'netbird-server:80' by container name over a shared external network,
#     which is what 'main-net' is here.
#   - No host ports for HTTP. The script publishes 8080/8081 for an external
#     proxy to reach; NPM reaches both containers by name over 'main-net'
#     instead, matching every other service here.
#   - STUN (3478/udp) IS published unconditionally. Like Pi-hole's DNS and
#     WireGuard's 51820/udp, this is raw UDP that NPM cannot front, and NAT
#     traversal is the whole point of the service. See README.md — it must
#     be reachable from the internet, which rules out Cloudflare Tunnel for
#     this one port.
#   - config.yaml and dashboard.env are generated by deploy.sh (they're
#     domain- and secret-dependent), not shipped as static files.
#
# This is a single-instance service: one NetBird deployment per host, under
# ~/docker/netbird/.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it
# (and the files it generates) to ~/docker/netbird/ and runs it from there.

services:
  dashboard:
    image: netbirdio/dashboard:${NETBIRD_DASHBOARD_VERSION:-latest}
    container_name: netbird-dashboard
    restart: unless-stopped
    env_file:
      - ./dashboard.env
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"
    networks:
      - main-net

  netbird-server:
    image: netbirdio/netbird-server:${NETBIRD_SERVER_VERSION:-latest}
    container_name: netbird-server
    restart: unless-stopped
    ports:
      # STUN — must be reachable from the internet for NAT traversal.
      - "3478:3478/udp"
    volumes:
      - netbird_data:/var/lib/netbird
      - ./config.yaml:/etc/netbird/config.yaml
    command: ["--config", "/etc/netbird/config.yaml"]
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"
    networks:
      - main-net

volumes:
  netbird_data:

networks:
  main-net:
    external: true
