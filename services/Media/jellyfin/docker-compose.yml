# Jellyfin — single official image, config/cache in Docker volumes, media
# bind-mounted from the host: https://jellyfin.org/docs/general/installation/container/
#
# Deliberate deviations from upstream's own guidance:
#   - No host port published by default — NGINX Proxy Manager reaches it by
#     container name over the shared 'main-net' instead (see README.md).
#   - No private '<service>-net' — like LinkStack, Jellyfin genuinely has
#     nothing else to isolate it from (one container, no database), so
#     'jellyfin-app' joins 'main-net' directly.
#   - Media is mounted read-only (:ro) — Jellyfin only needs to read/stream
#     your library; it stores its own metadata/images in /config, not
#     alongside your media files (unless you opt into local NFO/image
#     saving, which needs write access — see README.md).
#   - Hardware transcoding (/dev/dri passthrough) is opt-in via
#     docker-compose.override.yml, generated by deploy.sh only if you say
#     yes — upstream's own guidance calls this "optional but recommended",
#     but it depends on hardware most servers won't have.
#
# This file is the SOURCE template (tracked in git). deploy.sh copies it (and
# the generated .env) to ~/docker/jellyfin/ and runs it from there.

services:
  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_VERSION:-latest}
    container_name: jellyfin-app
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      JELLYFIN_PublishedServerUrl: "${PUBLISHED_URL:-}"
    volumes:
      - config:/config
      - cache:/cache
      - "${MEDIA_PATH}:/media:ro"
    networks:
      - main-net

volumes:
  config:
  cache:

networks:
  main-net:
    external: true
