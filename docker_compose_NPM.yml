# Standalone NGINX Proxy Manager stack (manual/reference use).
#
# This is the same stack the installer script (install_dockhub.sh)
# generates automatically -- kept here as a reference/manual-use template.
# If you use this file directly (without running the installer script
# first), you must create the external network it depends on first:
#
#   docker network create main-net
#
# Then: docker compose -f docker_compose_NPM.yml up -d

services:
  app:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      # These ports are in format <host-port>:<container-port>
      - '80:80'   # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81'   # Admin Web Port
      # Add any other Stream port you want to expose
      # - '21:21' # FTP

    #environment:
      # Uncomment this if you want to change the location of
      # the SQLite DB file within the container
      # DB_SQLITE_FILE: "/data/database.sqlite"

      # Uncomment this if IPv6 is not enabled on your host
      # DISABLE_IPV6: 'true'

    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

    networks:
      - main-net

    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  main-net:
    external: true
